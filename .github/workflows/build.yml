name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fordix-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 5

  ingame-test:
    # Starts the real client without a screen (Xvfb + software OpenGL), opens every Fordix screen and
    # takes a screenshot of each (see client/devtest/DevTest). Fails if the game crashes or stalls.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1

      - name: Run the client
        # The runner sometimes fails to open the early loading window ("Timed out trying to setup the
        # Game Window") and Forge then asks y/n forever on stdin: no early window, no stdin, a hard
        # time limit, and one retry in case the game itself stalls.
        run: |
          mkdir -p run/config
          echo "onboardAccessibility:false" > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          for attempt in 1 2; do
            rm -rf run/fordix-shots
            timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" env FORDIX_DEVTEST=1 LIBGL_ALWAYS_SOFTWARE=1 \
              MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 \
              ./gradlew --no-daemon runClient < /dev/null 2>&1 | head -c 20000000 > client.log || true
            if grep -q "\[devtest\] finished" client.log; then
              exit 0
            fi
            echo "Attempt $attempt did not finish the in-game test"
          done
          exit 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ingame-screenshots
          path: |
            run/fordix-shots/*.png
            client.log
          if-no-files-found: warn
          retention-days: 5
