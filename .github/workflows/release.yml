name: Release

# Publie le jar de Fordix en release GitHub à chaque tag vX.Y.Z, comme Astral-launcher. Le VPS
# surveille la dernière release (sync-astralnexus-mod.py d'Omneria/ALlauncher, lancé par
# scripts/vps/fordix-mod-sync.service de ce dépôt) et l'installe dans le modpack ;
# sync-server-mods.py le recopie ensuite sur le serveur Minecraft. Un tag = une mise à jour
# des joueurs et du serveur.

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le nom du jar (fordix-<mod_version>.jar) sert au VPS à identifier la version : un tag
      # qui ne correspond pas à mod_version publierait un jar mal nommé.
      - name: Check mod_version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$tag_version" != "$mod_version" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à mod_version=$mod_version (gradle.properties). Mettre à jour mod_version, committer, puis re-tagger."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/fordix-${GITHUB_REF_NAME#v}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar introuvable. Contenu de build/libs :"; ls -la build/libs; exit 1
          fi
          # Empreinte vérifiée par le VPS avant d'installer le jar.
          (cd build/libs && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          # Idempotent : une release vide/ratée pour ce tag ne doit pas bloquer un nouvel essai.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" "$jar.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" \
              --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
